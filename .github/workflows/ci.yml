name: CI

# 触发：推送到 feature/pure-frontend、或针对该分支的 PR。
# 纯前端方案后无服务端部署，本文件仅为代码质量门禁：
#   - Rust oracle 侧：fmt / clippy / test
#   - 前端引擎侧：模板预处理 + golden 生成 + Node 单测对照
on:
  push:
    branches: [feature/pure-frontend]
  pull_request:
    branches: [feature/pure-frontend]

# 同一分支只保留最新一次运行，节省 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仓库里的 rust-toolchain.toml 固定为 Windows GNU 工具链（本地开发用）。
  # CI 跑在 Linux 上，用该变量强制覆盖为 Linux stable，
  # 避免 rustup 去下载 Windows 主机工具链而失败。
  # （RUSTUP_TOOLCHAIN 优先级高于 rust-toolchain.toml。）
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  # ── 代码质量 + 测试（对应 CLAUDE.md 提交前要求：fmt / check / test）──
  test:
    name: 格式 / Clippy / 测试 / 前端引擎
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行 Rust 测试
        run: cargo test --workspace

      # ── 前端引擎：模板预处理 → 内嵌 → 扫描断言 → golden → Node 单测对照 ──
      - name: 模板预处理 + base64 内嵌 + 扫描断言
        run: |
          mkdir -p .cache
          cargo run -p devtools -- preprocess template.imazingapp .cache/template.imazingapp
          node scripts/build-template.js .cache/template.imazingapp
          cargo run -p devtools -- scan config .cache/template.imazingapp

      - name: 生成 golden + Node 引擎测试（条目级对照）
        run: |
          cargo run -p devtools -- golden config .cache/template.imazingapp golden
          node miniprogram/engine/test/engine.test.js
